name: ⚡ Personal Windows x64 NSIS

run-name: "⚡ Personal Windows x64 NSIS · ${{ github.ref_name }}"

on:
  workflow_dispatch:
  push:
    tags:
      - "personal-windows-nsis-*"

concurrency:
  group: personal-windows-nsis-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Split each crate into more codegen units so the large app crate compiles
  # across all 16 runner cores. Personal builds trade a little peak runtime
  # optimization for a much shorter build.
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "256"

jobs:
  build-nsis:
    name: "🪟 Windows x64 NSIS installer"
    runs-on: blacksmith-16vcpu-windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: 🦀 Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 🦀 Restore Rust cache
        id: rust-cache
        uses: swatinem/rust-cache@v2
        with:
          prefix-key: personal-v2
          # A fixed shared key (no job id) lets every run restore the exact
          # dependency cache while Cargo.lock is unchanged.
          shared-key: windows-x64-nsis
          cache-on-failure: true

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: ⚡ Restore production frontend
        id: frontend-cache
        uses: actions/cache@v6
        with:
          path: dist
          key: personal-frontend-v2-${{ hashFiles('package.json', 'package-lock.json', 'index.html', 'vite.config.ts', 'tsconfig*.json', 'src/**', 'public/**', 'announcements.json', 'remote-config.json') }}

      - name: 💾 Restore Tauri bundler tools
        id: tauri-tools-cache
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\tauri
          key: personal-tauri-tools-v2-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            personal-tauri-tools-v2-

      - name: 📦 Install frontend dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: 🔄 Sync versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          npm run sync-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: 🖼️ Build production frontend
        if: steps.frontend-cache.outputs.cache-hit != 'true'
        run: npx vite build

      - name: 🏗️ Build NSIS installer
        id: build
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          started=$(date +%s)
          npx tauri build --ci --no-sign --bundles nsis \
            --config src-tauri/tauri.personal-build.conf.json 2>&1 | tee build-windows-x64-nsis.log
          echo "seconds=$(( $(date +%s) - started ))" >> "$GITHUB_OUTPUT"

      - name: 🔎 Locate installer
        id: installer
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(target/release/bundle/nsis/*.exe)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "Expected exactly one NSIS installer, found ${#installers[@]}." >&2
            exit 1
          fi
          installer="${installers[0]}"
          {
            echo "path=${installer}"
            echo "name=$(basename "${installer}")"
            echo "size_mb=$(awk "BEGIN { printf \"%.1f\", $(stat -c %s "${installer}") / 1048576 }")"
            echo "sha256=$(sha256sum "${installer}" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: 📤 Upload NSIS installer
        uses: actions/upload-artifact@v6
        with:
          name: cockpit-tools-${{ steps.version.outputs.version }}-windows-x64-nsis-${{ steps.version.outputs.short_sha }}
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: ${{ steps.installer.outputs.path }}

      - name: 📜 Print build log on failure
        if: failure()
        shell: bash
        run: |
          if [ -f build-windows-x64-nsis.log ]; then
            tail -n 200 build-windows-x64-nsis.log
          else
            echo "Build log not found"
          fi

      - name: 🧾 Publish build summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_SECONDS: ${{ steps.build.outputs.seconds }}
          INSTALLER_NAME: ${{ steps.installer.outputs.name }}
          INSTALLER_SIZE_MB: ${{ steps.installer.outputs.size_mb }}
          INSTALLER_SHA256: ${{ steps.installer.outputs.sha256 }}
          RUST_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          FRONTEND_CACHE_HIT: ${{ steps.frontend-cache.outputs.cache-hit }}
          TOOLS_CACHE_HIT: ${{ steps.tauri-tools-cache.outputs.cache-hit }}
        run: |
          hit() { [ "$1" = "true" ] && echo "⚡ Exact hit" || echo "🔨 Rebuilt or partial"; }
          {
            echo "### ⚡ Personal Windows x64 NSIS"
            echo
            if [ "$JOB_STATUS" = "success" ]; then
              echo "✅ **Installer built.**"
            else
              echo "❌ **Installer build failed.**"
            fi
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Version | \`${VERSION:-unknown}\` |"
            echo "| Commit | \`${GITHUB_SHA::8}\` on \`${GITHUB_REF_NAME}\` |"
            [ -n "$INSTALLER_NAME" ] && echo "| Installer | \`${INSTALLER_NAME}\` (${INSTALLER_SIZE_MB} MB) |"
            [ -n "$INSTALLER_SHA256" ] && echo "| SHA-256 | \`${INSTALLER_SHA256}\` |"
            [ -n "$BUILD_SECONDS" ] && echo "| Tauri build | $(( BUILD_SECONDS / 60 ))m $(( BUILD_SECONDS % 60 ))s |"
            echo "| Rust cache | $(hit "$RUST_CACHE_HIT") |"
            echo "| Frontend | $(hit "$FRONTEND_CACHE_HIT") |"
            echo "| Bundler tools | $(hit "$TOOLS_CACHE_HIT") |"
          } >> "$GITHUB_STEP_SUMMARY"
