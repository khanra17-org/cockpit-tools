name: ⚡ Personal Windows x64 NSIS

on:
  workflow_dispatch:
  push:
    tags:
      - "personal-windows-nsis-*"

concurrency:
  group: personal-windows-nsis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-nsis:
    name: "🏗️ Build: Windows x64 NSIS"
    runs-on: blacksmith-16vcpu-windows-2025
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: 🦀 Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: 🦀 Rust cache
        uses: swatinem/rust-cache@v2
        with:
          prefix-key: personal-v1
          key: personal-windows-x64-nsis
          cache-on-failure: true

      - name: ⚡ Restore Windows sidecar
        id: sidecar-cache
        uses: actions/cache@v6
        with:
          path: sidecars/cockpit-cliproxy/bin/cockpit-cliproxy-x86_64-pc-windows-msvc.exe
          key: personal-sidecar-v1-${{ hashFiles('sidecars/cockpit-cliproxy/**/*.go', 'sidecars/cockpit-cliproxy/**/go.mod', 'sidecars/cockpit-cliproxy/**/go.sum', 'src-tauri/build.rs', '.github/workflows/personal-windows-nsis.yml') }}

      - name: 🐹 Go setup
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: sidecars/cockpit-cliproxy/go.mod
          cache-dependency-path: sidecars/cockpit-cliproxy/go.sum

      - name: ⚙️ Node.js setup
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"

      - name: ⚡ Restore production frontend
        id: frontend-cache
        uses: actions/cache@v6
        with:
          path: dist
          key: personal-frontend-v1-${{ hashFiles('package.json', 'package-lock.json', 'index.html', 'vite.config.ts', 'tsconfig*.json', 'src/**', 'public/**', 'announcements.json', 'remote-config.json', 'scripts/sync-version.js', 'src-tauri/tauri*.json', '.github/workflows/personal-windows-nsis.yml') }}

      - name: 💾 Cache Tauri tooling
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\tauri
          key: personal-tauri-v1-windows-x64-${{ hashFiles('package-lock.json', 'Cargo.lock', '**/Cargo.toml', 'src-tauri/tauri*.json') }}
          restore-keys: |
            personal-tauri-v1-windows-x64-

      - name: 📦 Install frontend dependencies and prefetch Go modules
        shell: bash
        env:
          SIDECAR_CACHE_HIT: ${{ steps.sidecar-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          npm ci --prefer-offline --no-audit --no-fund &
          npm_pid=$!

          go_pid=""
          if [ "${SIDECAR_CACHE_HIT}" != "true" ]; then
            (
              cd sidecars/cockpit-cliproxy
              go mod download
            ) &
            go_pid=$!
          fi

          wait "$npm_pid"
          if [ -n "$go_pid" ]; then
            wait "$go_pid"
          fi

      - name: 🔄 Sync versions
        run: npm run sync-version

      - name: 🖼️ Build production frontend
        if: steps.frontend-cache.outputs.cache-hit != 'true'
        run: npx vite build

      - name: 🔧 Build Windows sidecar
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        working-directory: sidecars/cockpit-cliproxy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" \
            -o bin/cockpit-cliproxy-x86_64-pc-windows-msvc.exe .

      - name: 🏗️ Build NSIS installer
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COCKPIT_SKIP_CLIPROXY_BUILD: "1"
        run: |
          set -euo pipefail
          npx tauri build --ci --no-sign --config src-tauri/tauri.personal-build.conf.json --bundles nsis 2>&1 | tee build-windows-x64-nsis.log

      - name: 📜 Print build log on failure
        if: failure()
        shell: bash
        run: |
          if [ -f build-windows-x64-nsis.log ]; then
            tail -n 200 build-windows-x64-nsis.log
          else
            echo "Build log not found"
          fi

      - name: 📊 Write build summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            result="✅ **NSIS installer built successfully.**"
          else
            result="❌ **NSIS installer build failed.**"
          fi

          {
            echo "### ⚡ Personal Windows x64 NSIS"
            echo
            echo "$result"
            echo
            echo "- Runner: \`blacksmith-16vcpu-windows-2025\`"
            echo "- Bundle: \`target/release/bundle/nsis/*.exe\`"
            echo
            echo "---"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload NSIS installer
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: cockpit-tools-windows-x64-nsis
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: target/release/bundle/nsis/*.exe
